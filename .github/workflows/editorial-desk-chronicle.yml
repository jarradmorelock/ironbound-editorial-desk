name: INTERNAL - Chronicle Collection

on:
  workflow_dispatch:
    inputs:
      week:
        description: Optional NFL week override; blank uses Sleeper state
        required: false
        default: ""
      finalize_matchups:
        description: Write finalized matchup events for the selected week
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/New_York"
    - cron: "17 12 * * 0,3-6"
      timezone: "America/New_York"
    - cron: "17 17 * * 0,3-6"
      timezone: "America/New_York"
    - cron: "17 21 * * 0,3-6"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: editorial-chronicle-writer
  cancel-in-progress: false

jobs:
  collect-chronicle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application code
        uses: actions/checkout@v6
        with:
          path: app

      - name: Check out Chronicle data branch
        uses: actions/checkout@v6
        with:
          ref: chronicle-data
          path: chronicle-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: python -m pip install -r requirements.txt

      - name: Run tests before Chronicle mutation
        working-directory: app
        run: python -m pytest -q

      - name: Prepare league configuration
        working-directory: app
        run: cp config/leagues.example.json config/leagues.json

      - name: Determine current NFL collection period
        id: period
        working-directory: app
        shell: bash
        env:
          WEEK_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.week || '' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from editorial_desk.sleeper import SleeperClient

          state = SleeperClient().nfl_state()
          season_type = str(state.get("season_type") or "").casefold()
          override = os.environ.get("WEEK_OVERRIDE", "").strip()
          week = int(override or state.get("week") or 0)
          active = season_type in {"regular", "post"} and 1 <= week <= 18
          print(f"active={str(active).lower()}")
          print(f"season={state.get('season') or 'unknown'}")
          print(f"week={week}")
          print(f"season_type={season_type or 'unknown'}")
          PY

      - name: Explain out-of-season no-op
        if: ${{ steps.period.outputs.active != 'true' }}
        run: echo "NFL state is not an active regular/postseason week; Chronicle collection skipped."

      - name: Collect lightweight Chronicle pulse
        if: ${{ steps.period.outputs.active == 'true' }}
        working-directory: app
        shell: bash
        env:
          FINALIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.finalize_matchups || false }}
        run: |
          args=(
            python -m editorial_desk chronicle-collect
            --config config/leagues.json
            --week "${{ steps.period.outputs.week }}"
            --chronicle-root ../chronicle-data
          )
          if [[ "$FINALIZE" == "true" ]]; then
            args+=(--finalize-matchups)
          fi
          "${args[@]}"

      - name: Commit Chronicle changes when present
        if: ${{ steps.period.outputs.active == 'true' }}
        working-directory: chronicle-data
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Chronicle unchanged; no commit needed."
            exit 0
          fi
          git config user.name "Ironbound Editorial Desk"
          git config user.email "actions@users.noreply.github.com"
          git add registry leagues cross_league coverage manifests diagnostics
          git commit -m "chronicle: collect ${{ steps.period.outputs.season }} week ${{ steps.period.outputs.week }} pulse"
          if ! git push origin HEAD:chronicle-data; then
            echo "Chronicle push lost a race. Refusing force-push; a later serialized run will retry from the remote head."
            exit 1
          fi
