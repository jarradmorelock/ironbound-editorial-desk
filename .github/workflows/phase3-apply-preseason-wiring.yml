name: Phase 3 apply preseason wiring

on:
  push:
    branches:
      - feature/editorial-desk-v2-phase3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/editorial-desk-v2-phase3
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/phase3_apply_preseason_wiring.py
      - name: Commit wiring changes if needed
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial_desk/publication_packets.py config/publications.json
          git commit -m "feat: wire preseason publication support"
          git push origin HEAD:feature/editorial-desk-v2-phase3
