name: Phase 4 apply Story Desk presentation

on:
  push:
    branches:
      - feature/editorial-desk-v2-phase4

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/editorial-desk-v2-phase4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/phase4_apply_story_presentation.py
      - name: Commit wiring changes if needed
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial_desk/story_desk.py
          git commit -m "feat: wire Story Desk presentation"
          git push origin HEAD:feature/editorial-desk-v2-phase4
