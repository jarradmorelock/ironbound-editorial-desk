name: Editorial desk dry run

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate configuration or collect a live read-only snapshot
        required: true
        default: validate
        type: choice
        options:
          - validate
          - collect
      week:
        description: NFL week to collect when mode is collect
        required: true
        default: "1"
      send_email:
        description: Email the publication dossiers after a successful collection
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Prepare safe example configuration
        run: cp config/leagues.example.json config/leagues.json

      - name: Validate configuration
        if: ${{ inputs.mode == 'validate' }}
        run: python -m editorial_desk validate-config --config config/leagues.json

      - name: Collect read-only weekly dossiers
        if: ${{ inputs.mode == 'collect' }}
        run: >-
          python -m editorial_desk collect
          --config config/leagues.json
          --week ${{ inputs.week }}
          --output-dir output/dry-run

      - name: Upload research dossiers
        if: ${{ inputs.mode == 'collect' }}
        uses: actions/upload-artifact@v7
        with:
          name: editorial-desk-week-${{ inputs.week }}
          path: output/dry-run/
          if-no-files-found: error
          retention-days: 14

      - name: Email publication dossiers
        if: ${{ inputs.mode == 'collect' && inputs.send_email }}
        env:
          IRONBOUND_GMAIL_ADDRESS: ${{ secrets.IRONBOUND_GMAIL_ADDRESS }}
          IRONBOUND_GMAIL_APP_PASSWORD: ${{ secrets.IRONBOUND_GMAIL_APP_PASSWORD }}
        run: >-
          python -m editorial_desk email
          --week ${{ inputs.week }}
          --output-dir output/dry-run
