name: Publication delivery fix verification

on:
  push:
    branches:
      - fix/publication-packet-delivery

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Focused regression
        run: python -m pytest tests/test_delivery_contract_boundary.py tests/test_emailer.py tests/test_publication_contracts.py -q
      - name: Full suite
        run: python -m pytest -q
      - name: Compile package
        run: python -m compileall -q editorial_desk
      # Temporary branch-only verifier; refreshed after the compatibility patch.
