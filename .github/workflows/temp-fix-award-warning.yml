name: TEMP - Fix Award Warning Compatibility

on:
  push:
    branches: [fix/historical-projection-awards]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[warning-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/historical-projection-awards
      - name: Restore compatible unavailable warning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('editorial_desk/honors.py')
          text = path.read_text(encoding='utf-8')
          old = 'Missing matching Sleeper retained projections or a verified legacy pregame capture.'
          new = 'Missing verified same-season/week frozen pregame capture and no matching Sleeper retained same-season/week projections were available.'
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify full suite
        run: python -m pip install -r requirements.txt && python -m pytest -q
      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial_desk/honors.py
          git commit -m "Keep legacy projection warning compatible [warning-fix]"
          git push origin HEAD:fix/historical-projection-awards
