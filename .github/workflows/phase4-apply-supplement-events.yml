name: Phase 4 apply supplement events

on:
  push:
    branches:
      - feature/editorial-desk-v2-phase4

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/editorial-desk-v2-phase4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/phase4_apply_supplement_events.py
      - name: Commit ledger supplement wiring if needed
        run: |
          if git diff --quiet; then
            echo "No supplement changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial_desk/supplement.py
          git commit -m "feat: drive Wednesday updates from Event Ledger"
          git push origin HEAD:feature/editorial-desk-v2-phase4
