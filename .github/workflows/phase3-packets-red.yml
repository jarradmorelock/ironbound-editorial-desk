name: Phase 3 packets red

on:
  push:
    branches:
      - feature/editorial-desk-v2-phase3

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_publication_packets.py tests/test_publication_render.py tests/test_packet_source_mapping.py tests/test_publication_packet_fixtures.py -q
