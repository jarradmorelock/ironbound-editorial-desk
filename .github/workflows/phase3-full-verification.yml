name: Phase 3 full verification

on:
  push:
    branches:
      - feature/editorial-desk-v2-phase3

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Full regression suite
        run: python -m pytest -q
      - name: Compile package
        run: python -m compileall -q editorial_desk
      - name: Verify locked publication semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("config/publications.json").read_text())
          publications = {row["key"]: row for row in payload["publications"]}

          story_desk = {key for key, row in publications.items() if row.get("story_desk")}
          assert story_desk == {"ironbound_weekly", "unbound_weekly"}, story_desk

          volunteer = publications["volunteer_voice"]
          volunteer_features = {
              contract["feature"]
              for contracts in (volunteer.get("feature_contracts") or {}).values()
              for contract in contracts
          }
          assert "division_metrics" not in volunteer_features
          assert "divisional_started_mvps" not in volunteer_features

          stampede_text = json.dumps(publications["the_stampede"])
          assert "What a Way to Make a Living" in stampede_text
          assert "Heavy Lifting" not in Path("config/publications.json").read_text()

          saturday = publications["saturday_standard"]
          saturday_features = {
              contract["feature"]
              for contracts in (saturday.get("feature_contracts") or {}).values()
              for contract in contracts
          }
          assert "division_metrics" in saturday_features
          assert "idp_position_metrics" in saturday_features
          PY
