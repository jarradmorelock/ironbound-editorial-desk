name: Feature Dynasty Daddy probe

on:
  push:
    branches:
      - feature/ironbound-nfl-enrichment

permissions:
  contents: read

jobs:
  dynasty-daddy-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current League Format endpoint
        shell: python
        run: |
          import json
          import urllib.request
          import urllib.error

          url = "https://dynasty-daddy.com/api/v1/league/format"
          payload = {
              "seasons": [2026],
              "startWeek": 1,
              "endWeek": 1,
              "settings": {
                  "passYd": 0.04,
                  "passTd": 6,
                  "passInt": -2,
                  "rushYd": 0.1,
                  "rushTd": 6,
                  "rushFD": 0.25,
                  "rec": 0.5,
                  "recYd": 0.1,
                  "recTd": 6,
                  "recFD": 0.25,
              },
              "format": {
                  "teamCount": 16,
                  "QB": 0,
                  "RB": 2,
                  "WR": 2,
                  "TE": 1,
                  "FLEX": 2,
                  "SUPER_FLEX": 1,
              },
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "ironbound-editorial-desk/0.1",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=90) as response:
                  raw = response.read().decode("utf-8")
                  print("HTTP_STATUS=" + str(response.status))
                  parsed = json.loads(raw)
                  print("PAYLOAD_TYPE=" + type(parsed).__name__)
                  if isinstance(parsed, dict):
                      print("PLAYER_COUNT=" + str(len(parsed)))
                      first_items = list(parsed.items())[:3]
                      print("SAMPLE=" + json.dumps(first_items, sort_keys=True)[:5000])
                  else:
                      print("SAMPLE=" + json.dumps(parsed, sort_keys=True)[:5000])
          except urllib.error.HTTPError as exc:
              print("HTTP_STATUS=" + str(exc.code))
              print("ERROR_BODY=" + exc.read().decode("utf-8", errors="replace")[:5000])
              raise
