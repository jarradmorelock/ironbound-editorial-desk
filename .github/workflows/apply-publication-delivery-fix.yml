name: Apply publication delivery patch

on:
  push:
    branches:
      - fix/publication-packet-delivery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply tested patch
        run: python tools/apply_publication_delivery_fix.py
      - name: Commit production fix when needed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "Ironbound Editorial Desk"
          git config user.email "actions@users.noreply.github.com"
          git add editorial_desk/collector.py editorial_desk/metrics.py editorial_desk/weekly_features.py editorial_desk/review.py editorial_desk/emailer.py
          git commit -m "fix: deliver publication-specific weekly packets"
          git push origin HEAD:fix/publication-packet-delivery
