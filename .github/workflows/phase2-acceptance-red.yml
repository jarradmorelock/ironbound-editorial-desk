name: Phase 2 acceptance red

on:
  push:
    branches:
      - feature/editorial-desk-v2-phase2

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_chronicle_registry_layout.py tests/test_chronicle_history_e2e.py -q
