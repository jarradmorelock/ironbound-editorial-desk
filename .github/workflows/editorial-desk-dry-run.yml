name: RUN THIS - Weekly Editorial Delivery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Production finalizes a completed week; Preview is read-only
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
          - validate
          - historical-week3-replay
      week:
        description: NFL week for Production or Preview
        required: true
        default: "1"
      send_email:
        description: Email the publication dossiers after a successful collection
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 21 * * 2"
      timezone: "America/New_York"
    - cron: "17 5 * * 3"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: editorial-chronicle-writer
  cancel-in-progress: false

jobs:
  weekly-delivery:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'historical-week3-replay' }}
    runs-on: ubuntu-latest
    env:
      NEWS_DATA_PUSH_TOKEN: ${{ secrets.NEWS_DATA_PUSH_TOKEN }}
    steps:
      - name: Check out application code
        uses: actions/checkout@v6
        with:
          path: app

      - name: Check out Chronicle data branch
        uses: actions/checkout@v6
        with:
          ref: chronicle-data
          path: chronicle-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: app
        run: python -m pytest -q

      - name: Prepare safe example configuration
        working-directory: app
        run: cp config/leagues.example.json config/leagues.json

      - name: Determine this run's job and completed week
        id: plan
        working-directory: app
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.mode }}" == "validate" ]]; then
              echo "active=true" >> "$GITHUB_OUTPUT"
              echo "season=manual" >> "$GITHUB_OUTPUT"
              echo "week=${{ inputs.week }}" >> "$GITHUB_OUTPUT"
              echo "job=validate" >> "$GITHUB_OUTPUT"
            elif [[ "${{ inputs.mode }}" == "preview" ]]; then
              echo "active=true" >> "$GITHUB_OUTPUT"
              echo "season=manual" >> "$GITHUB_OUTPUT"
              echo "week=${{ inputs.week }}" >> "$GITHUB_OUTPUT"
              echo "job=preview" >> "$GITHUB_OUTPUT"
            else
              echo "job=primary" >> "$GITHUB_OUTPUT"
              REQUESTED_WEEK="${{ inputs.week }}" python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from editorial_desk.period import detect_completed_period, PeriodDetectionError

          requested = int(os.environ["REQUESTED_WEEK"])
          try:
              period = detect_completed_period()
          except PeriodDetectionError as exc:
              print("active=false")
              print("season=unknown")
              print(f"week={requested}")
              print(f"reason=Could not verify completed NFL week: {exc}")
          else:
              verified = bool(period["active"]) and int(period["week"]) == requested
              print(f"active={str(verified).lower()}")
              print(f"season={period['season']}")
              print(f"week={requested}")
              if verified:
                  print(f"reason=NFL Week {requested} is verified fully complete; safe to finalize")
              else:
                  print(
                      "reason=Requested production week does not match the latest fully "
                      f"completed NFL week ({period['week']})"
                  )
          PY
            fi
          else
            if [[ "${{ github.event.schedule }}" == "17 21 * * 2" ]]; then
              echo "job=primary" >> "$GITHUB_OUTPUT"
            else
              echo "job=backup" >> "$GITHUB_OUTPUT"
            fi
            python -m editorial_desk completed-period >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse unsafe manual Production
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'production' && steps.plan.outputs.active != 'true' }}
        run: |
          echo "${{ steps.plan.outputs.reason }}"
          echo "Production was not run because the requested week is not verified fully complete."
          exit 1

      - name: Explain a scheduled no-op
        if: ${{ github.event_name != 'workflow_dispatch' && steps.plan.outputs.active != 'true' }}
        run: echo "${{ steps.plan.outputs.reason }}; no packet will be sent."

      - name: Validate configuration
        if: ${{ steps.plan.outputs.job == 'validate' }}
        working-directory: app
        run: python -m editorial_desk validate-config --config config/leagues.json

      - name: Restore Tuesday packet for Wednesday comparison
        id: baseline
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'backup' }}
        uses: actions/cache/restore@v4
        with:
          path: output/primary
          key: editorial-baseline-${{ steps.plan.outputs.season }}-week-${{ steps.plan.outputs.week }}
          fail-on-cache-miss: false

      - name: Finalize completed week into Chronicle
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'primary' }}
        working-directory: app
        run: >-
          python -m editorial_desk chronicle-collect
          --config config/leagues.json
          --week ${{ steps.plan.outputs.week }}
          --chronicle-root ../chronicle-data
          --finalize-matchups

      - name: Materialize finalized Chronicle history
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'primary' }}
        working-directory: app
        run: >-
          python -m editorial_desk chronicle-materialize
          --chronicle-root ../chronicle-data
          --allow-partial

      - name: Commit finalized Chronicle revision
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'primary' }}
        working-directory: chronicle-data
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Chronicle unchanged after Tuesday finalization."
            exit 0
          fi
          git config user.name "Ironbound Editorial Desk"
          git config user.email "actions@users.noreply.github.com"
          git add registry leagues cross_league coverage manifests diagnostics
          git commit -m "chronicle: finalize ${{ steps.plan.outputs.season }} week ${{ steps.plan.outputs.week }}"
          git push origin HEAD:chronicle-data

      - name: Capture pinned Chronicle SHA
        id: chronicle_sha
        if: ${{ steps.plan.outputs.active == 'true' && (steps.plan.outputs.job == 'primary' || steps.plan.outputs.job == 'preview') }}
        working-directory: chronicle-data
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch Tuesday rankings handoff when available
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job != 'validate' }}
        working-directory: app
        shell: bash
        run: |
          mkdir -p editorial-inputs/assets
          for pair in "main:ironbound_weekly" "free:unbound_weekly"; do
            source_key="${pair%%:*}"
            publication_key="${pair##*:}"
            json_url="https://raw.githubusercontent.com/jarradmorelock/Ironbound_power_ranks/main/handoff/${source_key}.json"
            if curl --fail --silent --show-error --location "$json_url" -o "editorial-inputs/${publication_key}.json"; then
              echo "Loaded ranking handoff for ${publication_key}."
              for asset in power-rankings playoff-forecast; do
                filename="${publication_key}-${asset}.png"
                asset_url="https://raw.githubusercontent.com/jarradmorelock/Ironbound_power_ranks/main/handoff/assets/${filename}"
                if curl --fail --silent --show-error --location "$asset_url" -o "editorial-inputs/assets/${filename}"; then
                  echo "Loaded authoritative ranking asset ${filename}."
                else
                  rm -f "editorial-inputs/assets/${filename}"
                  echo "WARNING: Missing ranking asset ${filename}; flagship research will remain incomplete."
                fi
              done
            else
              rm -f "editorial-inputs/${publication_key}.json"
              rm -f "editorial-inputs/assets/${publication_key}-power-rankings.png"
              rm -f "editorial-inputs/assets/${publication_key}-playoff-forecast.png"
              echo "WARNING: No current ranking handoff for ${publication_key}; packet will mark those inputs awaiting."
            fi
          done

      - name: Fetch durable beat/news ledger
        id: beat_news
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job != 'validate' }}
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p beat-inputs
          revision="$(git ls-remote https://github.com/jarradmorelock/Ironbound-Forum-Feed-Poster.git refs/heads/news-data | awk '{print $1}')"
          if [ -z "$revision" ]; then
            echo "ERROR: Could not resolve Ironbound-Forum-Feed-Poster news-data revision."
            exit 1
          fi
          if ! curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/jarradmorelock/Ironbound-Forum-Feed-Poster/$revision/ledger/current/events.jsonl" \
            -o beat-inputs/events.jsonl; then
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/jarradmorelock/Ironbound-Forum-Feed-Poster/$revision/ledger/events.jsonl" \
              -o beat-inputs/events.jsonl
          fi
          for ledger_file in manifest.json by-player.json coverage.json; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/jarradmorelock/Ironbound-Forum-Feed-Poster/$revision/ledger/current/$ledger_file" \
              -o "beat-inputs/$ledger_file" || true
          done
          if [ ! -f beat-inputs/coverage.json ]; then
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/jarradmorelock/Ironbound-Forum-Feed-Poster/$revision/ledger/coverage.json" \
              -o beat-inputs/coverage.json || true
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Loaded durable beat/news ledger at revision $revision."

      - name: Collect complete weekly dossiers
        if: ${{ steps.plan.outputs.active == 'true' && (steps.plan.outputs.job == 'primary' || steps.plan.outputs.job == 'preview') }}
        working-directory: app
        run: >-
          python -m editorial_desk collect
          --config config/leagues.json
          --week ${{ steps.plan.outputs.week }}
          --output-dir ../output/primary
          --chronicle-root ../chronicle-data
          --chronicle-revision "${{ steps.chronicle_sha.outputs.sha }}"
          --external-inputs-dir editorial-inputs
          --beat-ledger beat-inputs/events.jsonl
          --beat-ledger-revision "${{ steps.beat_news.outputs.revision }}"

      - name: Verify publication-complete packet delivery
        if: ${{ steps.plan.outputs.active == 'true' && (steps.plan.outputs.job == 'primary' || steps.plan.outputs.job == 'preview') }}
        working-directory: app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("../output/primary")
          dossiers = sorted(root.glob("*/week-*/*/dossier.json"))
          if not dossiers:
              raise SystemExit("No publication dossiers were generated.")

          missing = [
              path.parent
              for path in dossiers
              if not (path.parent / "publication_complete_packet.json").is_file()
          ]
          if missing:
              raise SystemExit(
                  "Missing publication_complete_packet.json for: "
                  + ", ".join(str(path) for path in missing)
              )
          print(f"Verified {len(dossiers)} publication-complete packets.")
          PY

      - name: Write news inbox consumption receipt
        if: ${{ steps.plan.outputs.active == 'true' && (steps.plan.outputs.job == 'primary' || steps.plan.outputs.job == 'preview') }}
        working-directory: app
        env:
          NEWS_REVISION: ${{ steps.beat_news.outputs.revision }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from editorial_desk.news_index import build_consumption_receipt

          root = Path("../output/primary")
          candidates = sorted(root.glob("*/week-*/*/publication_complete_packet.json"))
          if not candidates:
              raise SystemExit("No publication-complete packet available for news receipt.")
          selected = candidates[0]
          for path in candidates:
              try:
                  packet = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              if (packet.get("issue_identity") or {}).get("publication_key") == "ironbound_weekly":
                  selected = path
                  break
          selected_packet = json.loads(selected.read_text(encoding="utf-8"))
          if not isinstance(selected_packet.get("news_index"), dict):
              raise SystemExit("Publication packet is missing the validated news_index contract.")
          if not isinstance(selected_packet.get("readiness"), dict):
              raise SystemExit("Publication packet is missing readiness validation.")
          manifest_path = Path("beat-inputs/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8")) if manifest_path.exists() else {}
          report = {
              "source_revision": __import__("os").environ.get("NEWS_REVISION"),
              "ledger_manifest": manifest,
          }
          issue = selected_packet.get("issue_identity") or {}
          receipt = build_consumption_receipt(
              report,
              selected,
              issue_key=f"{issue.get('publication_key', 'publication')}-{issue.get('season', 'unknown')}-week-{issue.get('week', 'unknown')}",
          )
          destination = root / "news-consumption-receipt.json"
          destination.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"Wrote news inbox receipt for {receipt.get('week_key') or 'legacy ledger'}.")
          PY

      - name: Acknowledge consumed news inbox on news-data branch
        if: ${{ success() && steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'primary' && env.NEWS_DATA_PUSH_TOKEN != '' }}
        uses: actions/checkout@v6
        with:
          repository: jarradmorelock/Ironbound-Forum-Feed-Poster
          ref: news-data
          path: news-data
          token: ${{ secrets.NEWS_DATA_PUSH_TOKEN }}
      - name: Commit news inbox receipt
        if: ${{ success() && steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'primary' && env.NEWS_DATA_PUSH_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p news-data/ledger/receipts
          cp app/../output/primary/news-consumption-receipt.json news-data/ledger/receipts/latest.json
          cd news-data
          git config user.name "Ironbound Editorial Desk"
          git config user.email "actions@users.noreply.github.com"
          git add ledger/receipts/latest.json
          if git diff --cached --quiet; then
            echo "News inbox receipt already recorded."
          else
            git commit -m "editorial: acknowledge consumed weekly news inbox"
            git push origin HEAD:news-data
          fi

      - name: Write Tuesday Chronicle baseline
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'primary' }}
        working-directory: app
        env:
          CHRONICLE_SHA: ${{ steps.chronicle_sha.outputs.sha }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path

          path = Path("../output/primary/chronicle-baseline.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              "chronicle_sha": os.environ["CHRONICLE_SHA"],
              "baseline_time": datetime.now(timezone.utc).isoformat(),
          }
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Check whether monthly Chronicle archive is due
        id: monthly_backup
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'primary' }}
        working-directory: app
        shell: bash
        run: >-
          python -m editorial_desk chronicle-monthly-backup-due
          --chronicle-root ../chronicle-data
          >> "$GITHUB_OUTPUT"

      - name: Build monthly Chronicle archive when due
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'primary' && steps.monthly_backup.outputs.due == 'true' }}
        working-directory: app
        run: >-
          python -m editorial_desk chronicle-backup
          --chronicle-root ../chronicle-data
          --output ../output/chronicle-backup/chronicle-${{ steps.plan.outputs.season }}-week-${{ steps.plan.outputs.week }}-${{ steps.chronicle_sha.outputs.sha }}.zip
          --chronicle-revision "${{ steps.chronicle_sha.outputs.sha }}"

      - name: Upload complete research dossiers
        if: ${{ steps.plan.outputs.active == 'true' && (steps.plan.outputs.job == 'primary' || steps.plan.outputs.job == 'preview') }}
        uses: actions/upload-artifact@v7
        with:
          name: editorial-desk-${{ steps.plan.outputs.season }}-week-${{ steps.plan.outputs.week }}
          path: output/primary/
          if-no-files-found: error
          retention-days: 14

      - name: Email complete publication dossiers
        if: ${{ steps.plan.outputs.active == 'true' && ((steps.plan.outputs.job == 'primary' && (github.event_name != 'workflow_dispatch' || inputs.send_email)) || (steps.plan.outputs.job == 'preview' && inputs.send_email)) }}
        working-directory: app
        shell: bash
        env:
          IRONBOUND_GMAIL_ADDRESS: ${{ secrets.IRONBOUND_GMAIL_ADDRESS }}
          IRONBOUND_GMAIL_APP_PASSWORD: ${{ secrets.IRONBOUND_GMAIL_APP_PASSWORD }}
        run: |
          args=(
            python -m editorial_desk email
            --week "${{ steps.plan.outputs.week }}"
            --output-dir ../output/primary
          )
          if [[ "${{ steps.plan.outputs.job }}" == "primary" && "${{ steps.monthly_backup.outputs.due }}" == "true" ]]; then
            args+=(
              --chronicle-archive "../output/chronicle-backup/chronicle-${{ steps.plan.outputs.season }}-week-${{ steps.plan.outputs.week }}-${{ steps.chronicle_sha.outputs.sha }}.zip"
              --monthly-receipt-root ../chronicle-data
              --chronicle-revision "${{ steps.chronicle_sha.outputs.sha }}"
            )
          fi
          "${args[@]}"

      - name: Email divisional MVP Card Shop handoff
        if: ${{ steps.plan.outputs.active == 'true' && ((steps.plan.outputs.job == 'primary' && (github.event_name != 'workflow_dispatch' || inputs.send_email)) || (steps.plan.outputs.job == 'preview' && inputs.send_email)) }}
        working-directory: app
        env:
          IRONBOUND_GMAIL_ADDRESS: ${{ secrets.IRONBOUND_GMAIL_ADDRESS }}
          IRONBOUND_GMAIL_APP_PASSWORD: ${{ secrets.IRONBOUND_GMAIL_APP_PASSWORD }}
        run: >-
          python -m editorial_desk email-divisional-mvps
          --week ${{ steps.plan.outputs.week }}
          --output-dir ../output/primary

      - name: Prune expired Chronicle diagnostics
        if: ${{ success() && steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'primary' }}
        working-directory: app
        run: >-
          python -m editorial_desk chronicle-prune-diagnostics
          --chronicle-root ../chronicle-data
          --retention-days 30

      - name: Commit Chronicle delivery and retention changes
        if: ${{ success() && steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'primary' }}
        working-directory: chronicle-data
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No Chronicle receipt or retention changes to commit."
            exit 0
          fi
          git config user.name "Ironbound Editorial Desk"
          git config user.email "actions@users.noreply.github.com"
          git add backup_receipts diagnostics
          git commit -m "chronicle: record editorial delivery ${{ steps.plan.outputs.season }} week ${{ steps.plan.outputs.week }}"
          git push origin HEAD:chronicle-data

      - name: Save Tuesday packet as Wednesday baseline
        if: ${{ success() && steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'primary' }}
        uses: actions/cache/save@v4
        with:
          path: output/primary
          key: editorial-baseline-${{ steps.plan.outputs.season }}-week-${{ steps.plan.outputs.week }}

      - name: Collect Wednesday Chronicle pulse
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'backup' }}
        working-directory: app
        run: >-
          python -m editorial_desk chronicle-collect
          --config config/leagues.json
          --week ${{ steps.plan.outputs.week }}
          --chronicle-root ../chronicle-data

      - name: Commit Wednesday Chronicle changes
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'backup' }}
        working-directory: chronicle-data
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Wednesday Chronicle pulse produced no changes."
            exit 0
          fi
          git config user.name "Ironbound Editorial Desk"
          git config user.email "actions@users.noreply.github.com"
          git add registry leagues cross_league coverage manifests diagnostics
          git commit -m "chronicle: Wednesday pulse ${{ steps.plan.outputs.season }} week ${{ steps.plan.outputs.week }}"
          git push origin HEAD:chronicle-data

      - name: Read Tuesday Chronicle baseline
        id: chronicle_baseline
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'backup' && steps.baseline.outputs.cache-hit == 'true' }}
        working-directory: app
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          value = json.loads(Path("../output/primary/chronicle-baseline.json").read_text(encoding="utf-8"))
          print(f"chronicle_sha={value['chronicle_sha']}")
          print(f"baseline_time={value['baseline_time']}")
          PY

      - name: Collect Wednesday comparison
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'backup' && steps.baseline.outputs.cache-hit == 'true' }}
        working-directory: app
        run: >-
          python -m editorial_desk collect
          --config config/leagues.json
          --week ${{ steps.plan.outputs.week }}
          --output-dir ../output/backup
          --chronicle-root ../chronicle-data
          --external-inputs-dir editorial-inputs
          --beat-ledger beat-inputs/events.jsonl
          --beat-ledger-revision "${{ steps.beat_news.outputs.revision }}"

      - name: Build delta-only Wednesday supplements
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'backup' && steps.baseline.outputs.cache-hit == 'true' }}
        working-directory: app
        run: >-
          python -m editorial_desk supplement
          --baseline-dir ../output/primary
          --current-dir ../output/backup
          --output-dir ../output/supplements
          --week ${{ steps.plan.outputs.week }}
          --chronicle-root ../chronicle-data
          --baseline-time "${{ steps.chronicle_baseline.outputs.baseline_time }}"

      - name: Explain a missing Tuesday baseline
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'backup' && steps.baseline.outputs.cache-hit != 'true' }}
        run: echo "Tuesday baseline is unavailable; refusing to send a duplicate full packet."

      - name: Upload Wednesday supplemental research
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'backup' && steps.baseline.outputs.cache-hit == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: editorial-desk-${{ steps.plan.outputs.season }}-week-${{ steps.plan.outputs.week }}-supplements
          path: output/supplements/
          if-no-files-found: ignore
          retention-days: 14

      - name: Email only newly captured Wednesday material
        if: ${{ steps.plan.outputs.active == 'true' && steps.plan.outputs.job == 'backup' && steps.baseline.outputs.cache-hit == 'true' }}
        working-directory: app
        env:
          IRONBOUND_GMAIL_ADDRESS: ${{ secrets.IRONBOUND_GMAIL_ADDRESS }}
          IRONBOUND_GMAIL_APP_PASSWORD: ${{ secrets.IRONBOUND_GMAIL_APP_PASSWORD }}
        run: >-
          python -m editorial_desk email-supplement
          --week ${{ steps.plan.outputs.week }}
          --output-dir ../output/supplements

  historical-week3-replay:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'historical-week3-replay' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the archived Week 3 replay inputs
        env:
          REQUESTED_WEEK: ${{ inputs.week }}
          SEND_EMAIL: ${{ inputs.send_email }}
        run: |
          test "$REQUESTED_WEEK" = "3"
          test "$SEND_EMAIL" = "false"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test hardened publication code
        run: python -m pytest -q
      - name: Restore exact Week 3 production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/jarradmorelock/ironbound-editorial-desk/actions/artifacts/11139287617/zip             -o replay-source.zip
          echo "f12eda0dc4c21e61c4fa161b05ac63ff6f97f2fe677ab6c724a3132686d403cd  replay-source.zip" | sha256sum --check
          python -m zipfile -e replay-source.zip replay-source
      - name: Restore pinned historical Chronicle without write credentials
        uses: actions/checkout@v6
        with:
          ref: 0ab00d7fcdf9b20d57f59912e7952863f3584036
          path: replay-chronicle
          persist-credentials: false
      - name: Restore pinned historical ranking handoff
        uses: actions/checkout@v6
        with:
          repository: jarradmorelock/Ironbound_power_ranks
          ref: 6300cb0db4145ea51bf7ee590ea7f3a3f6b6d752
          path: replay-rankings
          persist-credentials: false
      - name: Rebuild Week 3 with production builders and no live network
        env:
          REPLAY_CODE_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/replay-week3.py <<'PY'
          """Audit harness: rerun production builders on immutable Week 3 sources.
          
          No collection, league writes, Chronicle writes, or email. All network access is
          for separately retrieving pinned source archives, before this script runs.
          """
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import socket
          
          from editorial_desk.config import load_publications
          from editorial_desk.chronicle_queries import ChronicleQueries
          from editorial_desk.external_inputs import load_external_inputs
          from editorial_desk.review import build_editorial_review, render_editorial_review
          from editorial_desk.flagship_research import build_flagship_research_packet, write_flagship_research_packet
          from editorial_desk.enriched_collector import _materialize_publication_assets, _write_publication_complete_artifacts
          from editorial_desk.roster_market import build_network_market_context, build_roster_market_report
          from editorial_desk.story_artifacts import write_story_desk_artifacts
          from editorial_desk.reading_packet import reading_packet_from_artifacts
          
          def no_network(*args, **kwargs):
              raise RuntimeError('Historical replay prohibits live network access')
          
          socket.socket = no_network
          
          base = Path('replay-source')
          source = base / '2026/week-03/ironbound_sixteen'
          root = Path('historical-replay-output')
          directory = root / '2026/week-03/ironbound_sixteen'
          directory.mkdir(parents=True, exist_ok=True)
          inputs = root / 'inputs'
          inputs.mkdir(exist_ok=True)
          shutil.copyfile('replay-rankings/handoff/main.json', inputs / 'ironbound_weekly.json')
          shutil.copytree('replay-rankings/handoff/assets', inputs / 'assets', dirs_exist_ok=True)
          snapshot = json.loads((source / 'snapshot.json').read_text())
          original = json.loads((source / 'flagship_research_packet.json').read_text())
          beat = original['beat_report']
          chronicle = ChronicleQueries(Path('replay-chronicle'))
          external = load_external_inputs(inputs / 'ironbound_weekly.json', 'ironbound_weekly')
          assets, _ = _materialize_publication_assets(external, directory)
          dossier = build_editorial_review(snapshot)
          dossier['chronicle_revision'] = snapshot['chronicle_revision']
          profile = load_publications(Path('config/publications.json'))['ironbound_weekly']
          write_story_desk_artifacts(directory, snapshot, dossier, profile,
              chronicle_root=Path('replay-chronicle'), external_inputs_dir=inputs)
          story = json.loads((directory / 'story_desk.json').read_text())
          snapshots = {p.parent.name: json.loads(p.read_text()) for p in base.rglob('snapshot.json')}
          network = build_network_market_context(snapshots)
          market = build_roster_market_report(snapshot, dossier, beat, network, chronicle=chronicle)
          research = build_flagship_research_packet(snapshot, dossier, story, external,
              history_root=base, chronicle=chronicle, publication_assets=assets,
              beat_report=beat, roster_market=market)
          dossier.setdefault('awards', {})['manager_of_the_week'] = research['weekly_honors']['manager_of_the_week']
          dossier['awards']['exceptional_loss_review'] = research['weekly_honors']['exceptional_loss_review']
          for name, value in [('snapshot', snapshot), ('dossier', dossier)]:
              (directory / (name + '.json')).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
          (directory / 'dossier.md').write_text(render_editorial_review(dossier))
          write_flagship_research_packet(directory, research)
          _write_publication_complete_artifacts(directory, snapshot, dossier, research, external,
              publication_assets=assets, beat_report=beat, chronicle=chronicle)
          (directory / 'reading_packet.md').write_text(reading_packet_from_artifacts(directory, dossier))
          packet = json.loads((directory / 'publication_complete_packet.json').read_text())
          manifest = {
              'mode': 'remote offline historical production-builder replay',
              'code_sha': os.environ['REPLAY_CODE_SHA'],
              'original_run_id': 36809946431, 'original_artifact_id': 11139287617,
              'original_artifact_sha256': hashlib.sha256(Path('replay-source.zip').read_bytes()).hexdigest(),
              'chronicle_sha': snapshot['chronicle_revision'],
              'rankings_sha': '6300cb0db4145ea51bf7ee590ea7f3a3f6b6d752',
              'beat_sha': beat['source_revision'],
              'beat_replay_policy': 'Preserve archived normalized beat report, including partial-coverage warning; do not invent missing accepted stories.',
              'information_cutoff': snapshot['collected_at'],
              'live_network_prohibited': True,
              'readiness': packet['readiness'],
              'output_files': {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                               for p in sorted(root.rglob('*')) if p.is_file()},
          }
          (root / 'replay_manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(json.dumps(packet['readiness'], indent=2))
          PY
          PYTHONPATH="$PWD" python /tmp/replay-week3.py
      - name: Upload historical publication packets and research
        uses: actions/upload-artifact@v7
        with:
          name: ironbound-week3-historical-pr32-${{ github.sha }}
          path: historical-replay-output/
          if-no-files-found: error
          retention-days: 14
