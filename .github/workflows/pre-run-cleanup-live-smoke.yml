name: Pre-run editorial cleanup live smoke

on:
  push:
    branches:
      - feature/pre-run-editorial-cleanup

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: cp config/leagues.example.json config/leagues.json
      - name: Collect live Week 1 dossiers
        run: python -m editorial_desk collect --config config/leagues.json --week 1 --output-dir output/smoke
      - name: Validate all seven publication dossiers
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("output/smoke/2026/week-01")
          expected = {
              "ironbound_sixteen": "dynasty_daddy",
              "free_ironbound_sixteen": "dynasty_daddy",
              "ballad_of_broken_hearts": "redraft_daddy",
              "nine_five": "redraft_daddy",
              "rocky_top_rumble": "redraft_daddy",
              "sec_dynasty": "dynasty_daddy",
              "best_characters_dynasty": "dynasty_daddy",
          }
          for key, expected_market in expected.items():
              dossier = json.loads((root / key / "dossier.json").read_text())
              market = dossier["market_context"]
              assert market["source"] == expected_market, (key, market)
              assert market["status"] == "available", (key, market)
              assert market["players"], (key, "no market players")
              sources = {row["name"] for row in dossier["source_manifest"]}
              assert {"Sleeper", "Dynasty Daddy", "nflverse"} <= sources
              lineup = dossier.get("lineup_efficiency") or []
              manager = (dossier.get("awards") or {}).get("manager_of_the_week")
              if lineup:
                  assert manager and manager["roster_id"] == lineup[0]["roster_id"], (key, manager, lineup[0])
              print(key, expected_market, market["status"], len(market["players"]))
      - uses: actions/upload-artifact@v7
        with:
          name: pre-run-editorial-cleanup-live-smoke
          path: output/smoke/
          retention-days: 2
