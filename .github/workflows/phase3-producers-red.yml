name: Phase 3 producers red

on:
  push:
    branches:
      - feature/editorial-desk-v2-phase3

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_feature_producers.py tests/test_manager_award.py tests/test_game_window_features.py tests/test_preseason_features.py tests/test_draft_context_collection.py -q
