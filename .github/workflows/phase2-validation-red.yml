name: Phase 2 red validation

on:
  push:
    branches:
      - feature/editorial-desk-v2-phase2

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_chronicle_identity.py tests/test_chronicle_backfill.py tests/test_chronicle_backfill_current_week.py tests/test_chronicle_materialize.py tests/test_chronicle_backfill_store.py tests/test_chronicle_backfill_cli.py -q
